<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../images/favicon.png" type="image/x-icon" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Korea-Bio" />
    <meta property="og:image" content="https://kimdaeho-cd.github.io/korea-bio/images/logo.png" />
    <meta property="og:url" content="https://kimdaeho-cd.github.io/korea-bio/" />
    <meta property="og:site_name" content="코리아-바이오" />
    <meta property="og:description" content="바이오 소부장 연대협력 협의체는 민관, 수요-공급의 연대화 협력을 통해" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,arrow_back,arrow_forward"
    />
    <!-- ✅ Swiper CSS 추가 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <title>korea bio</title>
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href=""> <img src="../images/logo.png" alt="로고" /></a>
      </h1>
      <nav class="gnb">
        <ul class="list">
          <li><a href="">협의체 소개</a></li>
          <li><a href="">협의체 기업 정보</a></li>
          <li><a href="">알림</a></li>
        </ul>
      </nav>
      <div class="menu">
        <ul class="list">
          <li><a href="">로그인</a></li>
          <li><a href="">회원가입</a></li>
          <span class="material-symbols-outlined"> menu </span>
        </ul>
      </div>
    </header>

    <!-- ✅ 메인비주얼: .swiper 래퍼 추가, 구조 정리 -->
    <div class="main-visual">
      <!-- ✅ .swiper 컨테이너 추가 -->
      <div class="swiper">
        <div class="swiper-wrapper visual-list">
          <div class="swiper-slide visual01">
            <img src="../images/visual1.jpg" alt="비주얼1" />
          </div>
          <div class="swiper-slide visual01">
            <img src="../images/visual2.jpg" alt="비주얼2" />
          </div>
          <div class="swiper-slide visual01">
            <img src="../images/visual3.jpg" alt="비주얼3" />
          </div>
        </div>
      </div>
      <div class="pagination-box">
        <div class="pagination"></div>
        <div class="nav">
          <span class="material-symbols-outlined btn-prev"> arrow_back </span>
          <span class="material-symbols-outlined btn-next"> arrow_forward </span>
        </div>
      </div>
    </div>

    <section class="section02">
      <p class="title">
        바이오 소부장 산업의 수요 -<br />
        공급 기업 간<br /><br />
        연대 협력 기반으로<br />
        <span class="bc-txt">동반 성장 및 자립화</span>를 통해<br /><br />
        <span class="thic-txt">질적 내실화를 도모하는 민관 합동 협의체</span>
      </p>
      <div><img src="../images/sec2_img1.jpg" alt="" /></div>
      <div><img src="../images/sec2_img2.jpg" alt="" /></div>
    </section>

    <!-- ✅ Swiper 초기화 코드 수정 -->
    <script>
      const productSlider = new Swiper(".main-visual .swiper", {
        slidesPerView: 1,
        spaceBetween: 0,
        speed: 1000,
        loop: true,
        effect: "cube",
        autoplay: {
          delay: 4000,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".main-visual .pagination",
          type: "bullets",
          clickable: true,
        },
        navigation: {
          // ✅ 올바른 셀렉터로 수정
          nextEl: ".main-visual .pagination-box .btn-next",
          prevEl: ".main-visual .pagination-box .btn-prev",
        },
      });
    </script>
  </body>
</html>
